# Import local .env configuration if present
spring.config.import=optional:file:.env[.properties]

# Disable devtools restart to prevent corrupted classloader reload issues
spring.devtools.restart.enabled=false

# Render dynamic port binding
server.port=${PORT:8080}

# PostgreSQL explicit dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Production schema changes must be applied through reviewed migrations, not on startup.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000

# HTTP Gzip Compression for Faster Network Delivery
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Platform Commission & Settlement Configuration
rideshare.commission.rate-percent=15.0
rideshare.commission.fixed-fee=20.0
rideshare.commission.outstanding-threshold=500.0
rideshare.commission.enforce-publish-threshold=true
rideshare.commission.calculation-type=PERCENT_PLUS_FIXED

# Brevo Transactional Email API Configuration
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:RideShare}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

# Gmail SMTP Email Configuration (Secondary Fallback)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

rideshare.mail.from=${MAIL_FROM:${BREVO_SENDER_EMAIL:${spring.mail.username:}}}
rideshare.mail.from-name=${MAIL_FROM_NAME:${BREVO_SENDER_NAME:RideShare}}
rideshare.mail.enabled=${MAIL_ENABLED:true}
rideshare.otp.expiry-minutes=${OTP_EXPIRATION_MINUTES:5}
rideshare.otp.cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
rideshare.otp.delivery-required=${OTP_DELIVERY_REQUIRED:false}

# Google Drive document storage. Keep the service-account JSON outside source control.
google.drive.parent-folder-id=${GOOGLE_DRIVE_PARENT_FOLDER_ID:}
google.drive.service-account-file=${GOOGLE_APPLICATION_CREDENTIALS:}

# Real-Time Driver Presence & Monitoring Configuration
rideshare.driver-tracking.heartbeat-interval-seconds=15
rideshare.driver-tracking.online-timeout-seconds=45
rideshare.driver-tracking.location-freshness-threshold-seconds=90

# Razorpay Payment Gateway Configuration
## This release is intentionally test-only. `LIVE` is rejected by RazorpayService.
razorpay.mode=${RAZORPAY_MODE:TEST}
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Authentication and browser access
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8081,https://*.onrender.com,https://*.vercel.app,https://*.ngrok-free.dev,https://*.ngrok-free.app,https://*.ngrok.io,https://*.trycloudflare.com}

# Redis Cloud Caching Configuration
spring.data.redis.host=${REDIS_HOST:desk-decision-grade-98721.db.redis.io}
spring.data.redis.port=${REDIS_PORT:16693}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:cMXvAW5wrOd2EFjqKJ26Pl3sITDemuwP}
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms
rideshare.redis.enabled=${REDIS_ENABLED:true}
